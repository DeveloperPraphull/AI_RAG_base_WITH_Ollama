version: "3.9"

services:
  ollama:
    image: ollama/ollama
    container_name: ollama
    restart: unless-stopped

    ports:
      - "11434:11434"

    volumes:
      - ollama_data:/root/.ollama
      - ./entrypoint.sh:/entrypoint.sh

    environment:
      - OLLAMA_HOST=0.0.0.0:11434

    entrypoint: ["/bin/sh", "/entrypoint.sh"]

    healthcheck:
      test: ["CMD", "sh", "-c", "curl -f http://127.0.0.1:11434/api/tags || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 90s

    networks:
      - rag-network

  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-api
    restart: unless-stopped

    ports:
      - "8000:8000"

    depends_on:
      ollama:
        condition: service_started

    environment:
      - OLLAMA_HOST=http://ollama:11434
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production

    volumes:
      - ./data:/app/data
      - ./chroma_db:/app/chroma_db
      - ./logs:/app/logs

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    networks:
      - rag-network

volumes:
  ollama_data:
    driver: local

networks:
  rag-network:
    driver: bridge